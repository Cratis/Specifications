name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      N:
        description: Specification classes per suite
        default: '500'
        required: true
        type: string
      F:
        description: Facts per class
        default: '5'
        required: true
        type: string
      R:
        description: Measured repetitions (plus one warm-up)
        default: '5'
        required: true
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.100'
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Check harness
        run: python3 -m unittest discover -s Benchmarks -p 'test_*.py' -v
      - name: Benchmark default and disabled parallelism
        env:
          AOT: '1'
          N: ${{ inputs.N }}
          F: ${{ inputs.F }}
          R: ${{ inputs.R }}
        run: Benchmarks/run.sh
      - name: Write summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=(Benchmarks/results/*.md)
          if (( ${#reports[@]} == 0 )); then
            echo 'Benchmark did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "${reports[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurements and runner logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specifications-benchmarks
          path: Benchmarks/results/
          if-no-files-found: error
