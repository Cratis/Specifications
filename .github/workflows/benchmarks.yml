name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      N:
        description: Specification classes per suite
        default: '500'
        required: true
        type: string
      F:
        description: Facts per class
        default: '5'
        required: true
        type: string
      R:
        description: Measured repetitions (plus one warm-up)
        default: '5'
        required: true
        type: string

env:
  DOTNET10_VERSION: "10.0.x"
  DOTNET11_VERSION: "11.0.x"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ env.DOTNET10_VERSION }}
            ${{ env.DOTNET11_VERSION }}
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Check harness
        run: python3 -m unittest discover -s Benchmarks -p 'test_*.py' -v
      - name: Benchmark default and disabled parallelism
        env:
          AOT: '1'
          N: ${{ inputs.N }}
          F: ${{ inputs.F }}
          R: ${{ inputs.R }}
        run: Benchmarks/run.sh
      - name: Write summary
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=(Benchmarks/results/*.md)
          if (( ${#reports[@]} == 0 )); then
            echo 'Benchmark did not produce a report.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat "${reports[@]}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload measurements and runner logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specifications-benchmarks
          path: Benchmarks/results/
          if-no-files-found: error
