name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET10_VERSION: "10.0.x"

on:
  push:
    branches:
      - "main"
    paths:
      - "Source/**"
      - "Integration/Consumers/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "Integration/Consumers/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET10_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Specifications.sln

      - name: Build
        run: dotnet build Specifications.sln --configuration Release --no-restore

      # TUnit and the native Cratis runner (Runner.Specs) run on Microsoft.Testing.Platform, which on the .NET 10 SDK cannot be mixed with the VSTest based xUnit and NUnit
      # projects under `dotnet test` (it requires a repository-wide runner switch in global.json), so they are run directly.
      # Only the spec projects are run here. The Sample projects intentionally contain
      # failing specs to demonstrate the framework, so they are not part of the CI test run.
      - name: Test
        run: |
          dotnet test Source/CodeAnalysis.Specs/CodeAnalysis.Specs.csproj --configuration Release --no-build
          dotnet test Source/XUnit.Specs/XUnit.Specs.csproj --configuration Release --no-build
          dotnet test Source/XUnit.DefaultBehavior.Specs/XUnit.DefaultBehavior.Specs.csproj --configuration Release --no-build
          dotnet run --project Source/TUnit.Specs/TUnit.Specs.csproj --configuration Release --no-build
          dotnet run --project Source/Runner.Specs/Runner.Specs.csproj --configuration Release --no-build
          dotnet test Source/XUnit.v3.Specs/XUnit.v3.Specs.csproj --configuration Release --no-build
          dotnet test Source/XUnit.v3.DefaultBehavior.Specs/XUnit.v3.DefaultBehavior.Specs.csproj --configuration Release --no-build
          dotnet test Source/NUnit.Specs/NUnit.Specs.csproj --configuration Release --no-build
          dotnet test Source/NUnit5.Specs/NUnit5.Specs.csproj --configuration Release --no-build

      - name: Test packed package consumers
        run: |
          set -euo pipefail
          dotnet pack Specifications.sln -c Release --no-build -o artifacts/packages -p:Version=0.0.0-ci
          dotnet build Integration/Consumers/XUnit/Consumer.XUnit.csproj --configuration Release
          dotnet test Integration/Consumers/XUnit/Consumer.XUnit.csproj --configuration Release --no-build
          dotnet build Integration/Consumers/XUnit.PerFact/Consumer.XUnit.PerFact.csproj --configuration Release
          dotnet test Integration/Consumers/XUnit.PerFact/Consumer.XUnit.PerFact.csproj --configuration Release --no-build
          dotnet build Integration/Consumers/XUnit.v3/XUnit.v3.csproj --configuration Release
          dotnet test Integration/Consumers/XUnit.v3/XUnit.v3.csproj --configuration Release --no-build
          dotnet build Integration/Consumers/NUnit/Consumer.NUnit.csproj --configuration Release
          dotnet test Integration/Consumers/NUnit/Consumer.NUnit.csproj --configuration Release --no-build
          dotnet build Integration/Consumers/NUnit5/NUnit5.csproj --configuration Release
          dotnet test Integration/Consumers/NUnit5/NUnit5.csproj --configuration Release --no-build
          dotnet build Integration/Consumers/TUnit/Consumer.TUnit.csproj --configuration Release
          dotnet run --project Integration/Consumers/TUnit/Consumer.TUnit.csproj --configuration Release --no-build
          dotnet build Integration/Consumers/Runner/Runner.csproj --configuration Release
          dotnet run --project Integration/Consumers/Runner/Runner.csproj --configuration Release --no-build
