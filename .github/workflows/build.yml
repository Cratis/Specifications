name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET10_VERSION: "10.0.x"
  DOTNET11_VERSION: "11.0.x"

on:
  push:
    branches:
      - "main"
    paths:
      - "Source/**"
      - "Integration/Consumers/**"
      - "Integration/Lifecycle/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - "Integration/Consumers/**"
      - "Integration/Lifecycle/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .Net
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            ${{ env.DOTNET10_VERSION }}
            ${{ env.DOTNET11_VERSION }}
          dotnet-quality: preview

      - name: Restore NuGet packages cache
        id: nuget-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Specifications.sln -p:SpecificationsTestFrameworks='"net10.0;net11.0"'

      - name: Build
        run: dotnet build Specifications.sln --configuration Release --no-restore -p:SpecificationsTestFrameworks='"net10.0;net11.0"' -bl:artifacts/logs/build.binlog

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-binlog
          path: artifacts/logs/build.binlog
          if-no-files-found: ignore

      # TUnit and the native Cratis runner (Runner.Specs) run on Microsoft.Testing.Platform, which on the .NET 10 and .NET 11 SDKs cannot be mixed with the VSTest based xUnit and NUnit
      # projects under `dotnet test` (it requires a repository-wide runner switch in global.json), so they are run directly.
      # Only the spec projects are run here. The Sample projects intentionally contain
      # failing specs to demonstrate the framework, so they are not part of the CI test run.
      # The spec processes are independent (--no-build), so they run in parallel with one log each.
      - name: Test
        shell: bash
        env:
          SpecificationsTestFrameworks: 'net10.0;net11.0'
        run: |
          set -uo pipefail
          mkdir -p artifacts/logs/specs
          commands=(
            "dotnet test Source/CodeAnalysis.Specs/CodeAnalysis.Specs.csproj --configuration Release --no-build"
            "dotnet test Source/XUnit.Specs/XUnit.Specs.csproj --configuration Release --no-build"
            "dotnet test Source/XUnit.DefaultBehavior.Specs/XUnit.DefaultBehavior.Specs.csproj --configuration Release --no-build"
            "dotnet run --project Source/TUnit.Specs/TUnit.Specs.csproj --configuration Release --no-build"
            "dotnet run --project Source/Runner.Specs/Runner.Specs.csproj --configuration Release --no-build"
            "dotnet test Source/XUnit.v3.Specs/XUnit.v3.Specs.csproj --configuration Release --no-build"
            "dotnet test Source/XUnit.v3.DefaultBehavior.Specs/XUnit.v3.DefaultBehavior.Specs.csproj --configuration Release --no-build"
            "dotnet test Source/NUnit.Specs/NUnit.Specs.csproj --configuration Release --no-build"
            "dotnet test Source/NUnit5.Specs/NUnit5.Specs.csproj --configuration Release --no-build"
          )
          failed=()
          for framework in net10.0 net11.0; do
            mkdir -p "artifacts/logs/specs/$framework"
            pids=()
            for index in "${!commands[@]}"; do
              bash -c "${commands[$index]} --framework $framework" > "artifacts/logs/specs/$framework/$index.log" 2>&1 &
              pids[index]=$!
            done
            for index in "${!commands[@]}"; do
              status=0
              wait "${pids[$index]}" || status=$?
              echo "::group::[exit $status] ${commands[$index]} --framework $framework"
              cat "artifacts/logs/specs/$framework/$index.log"
              echo "::endgroup::"
              if [ "$status" -ne 0 ]; then
                failed+=("${commands[$index]} --framework $framework (exit $status)")
              fi
            done
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::${#failed[@]} spec process(es) failed:"
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi

      - name: Pack packages for consumers
        shell: bash
        run: |
          set -euo pipefail
          # The cached packages folder may hold 0.0.0-ci from an earlier run; make sure consumers restore the fresh pack.
          rm -rf "${NUGET_PACKAGES:-$HOME/.nuget/packages}"/cratis.specifications*/0.0.0-ci
          dotnet pack Specifications.sln -c Release --no-build -o artifacts/packages -p:Version=0.0.0-ci

      - name: Test packed package consumers
        shell: bash
        run: |
          set -euo pipefail
          consumers=(
            "test Integration/Consumers/XUnit/Consumer.XUnit.csproj"
            "test Integration/Consumers/XUnit.PerFact/Consumer.XUnit.PerFact.csproj"
            "test Integration/Consumers/XUnit.v3/XUnit.v3.csproj"
            "test Integration/Consumers/Resources/Resources.csproj"
            "test Integration/Consumers/NUnit/Consumer.NUnit.csproj"
            "test Integration/Consumers/NUnit5/NUnit5.csproj"
            "run Integration/Consumers/TUnit/Consumer.TUnit.csproj"
            "run Integration/Consumers/Runner/Runner.csproj"
            "test Integration/Consumers/AnalyzersOff/AnalyzersOff.csproj"
            "run Integration/Consumers/AssertionXml/OpenApi/OpenApi.csproj"
          )
          for consumer in "${consumers[@]}"; do
            dotnet restore "${consumer#* }"
          done
          for consumer in "${consumers[@]}"; do
            dotnet build "${consumer#* }" --configuration Release --no-restore
          done

          # Prove the consumers restored the freshly packed packages and not stale ones from the cache.
          packages="${NUGET_PACKAGES:-$HOME/.nuget/packages}"
          checked=0
          for nupkg in artifacts/packages/*.0.0.0-ci.nupkg; do
            name="$(basename "$nupkg" .nupkg)"
            id="${name%.0.0.0-ci}"
            lower="$(echo "$id" | tr "[:upper:]" "[:lower:]")"
            restored="$packages/$lower/0.0.0-ci/$lower.0.0.0-ci.nupkg.sha512"
            if [ -f "$restored" ]; then
              expected="$(openssl dgst -sha512 -binary "$nupkg" | openssl base64 -A)"
              if [ "$(cat "$restored")" != "$expected" ]; then
                echo "::error::Restored $id 0.0.0-ci differs from the freshly packed package"
                exit 1
              fi
              checked=$((checked + 1))
            fi
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::No freshly packed package was restored by the consumers"
            exit 1
          fi
          echo "Verified $checked restored package(s) match artifacts/packages"

          for consumer in "${consumers[@]}"; do
            if [ "${consumer%% *}" = "test" ]; then
              dotnet test "${consumer#* }" --configuration Release --no-build
            else
              dotnet run --project "${consumer#* }" --configuration Release --no-build
            fi
          done

      - name: Check isolated pre-lifecycle assertion registration
        shell: bash
        run: |
          set -euo pipefail
          project=Integration/Consumers/AssertionXml/PlainAssertions/PlainAssertions.csproj
          dotnet restore "$project"
          dotnet build "$project" -c Release --no-restore
          dotnet run --project "$project" -c Release --no-build --no-restore -- Probe.A-B Consumer.AssertionXml.FirstProbe
          dotnet run --project "$project" -c Release --no-build --no-restore -- Probe.A_B Consumer.AssertionXml.SecondProbe

      - name: Check assertion registration incremental generation
        shell: bash
        run: |
          set -euo pipefail
          node Integration/Consumers/AssertionXml/verify-generation.mjs First Probe.A-B
          node Integration/Consumers/AssertionXml/verify-generation.mjs Second Probe.A_B
          source=Integration/Consumers/AssertionXml/First/obj/Release/net11.0/CratisSpecificationsAssertionFailures.g.cs
          previous_write_time="$(node -e 'console.log(require("node:fs").statSync(process.argv[1]).mtimeMs)' "$source")"
          dotnet build Integration/Consumers/AssertionXml/First/First.csproj -c Release --no-restore
          node Integration/Consumers/AssertionXml/verify-generation.mjs First Probe.A-B "$previous_write_time"
          dotnet build Integration/Consumers/AssertionXml/First/First.csproj -c Release --no-restore -p:AssertionProbeAssemblyName=Probe.Renamed
          node Integration/Consumers/AssertionXml/verify-generation.mjs First Probe.Renamed

      - name: Verify shared lifecycle failures and cancellation through all adapters
        shell: bash
        run: |
          set -euo pipefail
          for consumer in \
            'XUnit XUnit/Consumer.XUnit.csproj' \
            'XUnitV3 XUnit.v3/XUnit.v3.csproj' \
            'NUnit4 NUnit/Consumer.NUnit.csproj' \
            'NUnit5 NUnit5/NUnit5.csproj' \
            'TUnit TUnit/Consumer.TUnit.csproj' \
            'Runner Runner/Runner.csproj'; do
            adapter="${consumer%% *}"
            stop=false
            if [ "$adapter" = Runner ]; then stop=true; fi
            dotnet build "Integration/Consumers/${consumer#* }" --configuration Release --no-restore \
              -p:LifecycleProof=true -p:PlatformStopProof="$stop"
            node Integration/Lifecycle/verify.mjs "$adapter"
          done

      - name: Verify MTP server-session Stop with concurrent classes
        run: node Integration/Lifecycle/stop.mjs

      - name: Remove packed packages from the NuGet cache
        if: always()
        run: rm -rf ~/.nuget/packages/cratis.specifications*/0.0.0-ci

      - name: Save NuGet packages cache
        if: success() && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
